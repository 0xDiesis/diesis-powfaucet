
name: Development Build

on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:

  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 26.12.1

    - run: npm ci
    - run: npm run test

  build_binaries:
    name: Build Binaries
    needs: [run_tests]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      with:
        node-version: 26.12.1

    - run: npm ci
    - run: npm run bundle

    # build client project
    - run: |
        cd faucet-client
        npm install
        node ./build-client.js 

    - run: npm run package:binaries
    - run: node scripts/verify-packaged-runtime.mjs bin/server-linux

    - name: Upload powfaucet.js artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./bundle/powfaucet.cjs
        name: powfaucet.js
    - name: Upload linux binary artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./bin/server-linux
        name: powfaucet-server-linux
    - name: Upload windows binary artifact
      uses: actions/upload-artifact@v7
      with:
        path: ./bin/server-win.exe
        name: powfaucet-server-win.exe

  verify_windows_binary:
    name: Verify packaged Windows runtime
    needs: [build_binaries]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 26.12.1
    - run: npm ci
    - uses: actions/download-artifact@v8
      with:
        name: powfaucet-server-win.exe
        path: bin
    - run: node scripts/verify-packaged-runtime.mjs bin/server-win.exe

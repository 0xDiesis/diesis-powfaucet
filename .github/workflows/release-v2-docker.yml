name: Build docker image for latest release

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build_docker:
    name: Build Docker Image
    # Set repository variable ENABLE_FORK_PUBLISH=true to enable Docker publish steps in this fork.
    if: vars.ENABLE_FORK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Get project versions
        id: version
        run: |
          server_version="$(jq -r '.version' package.json)"
          client_version="$(jq -r '.version' faucet-client/package.json)"
          echo "server_version=$server_version" >> "$GITHUB_OUTPUT"
          echo "client_version=$client_version" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch images
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file Dockerfile \
            --tag pk910/powfaucet:v${{ steps.version.outputs.server_version }} \
            --tag pk910/powfaucet:v2-stable \
            --push .


name: Release latest v2 version

on:
  workflow_dispatch:

env:
  NODE_VERSION: '26.12.1'
  # Set repository variable ENABLE_FORK_PUBLISH=true to enable npm, GitHub release, and Docker publish steps in this fork.

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}

    - run: npm ci
    - run: npm run test

  build_binaries:
    name: Build Binaries
    outputs:
      server_version: ${{ steps.version.outputs.server_version }}
      client_version: ${{ steps.version.outputs.client_version }}
    needs: [run_tests]
    if: vars.ENABLE_FORK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # setup global dependencies
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: "https://registry.npmjs.org"

    # build server project
    - run: |
        npm ci
        npm run bundle

    # build client project
    - run: |
        cd faucet-client
        npm install
        node ./build-client.js 

    # Preserve the packages built alongside the qualified executables.
    - run: npm pack --pack-destination .
    - run: npm pack --pack-destination ..
      working-directory: faucet-client

    # package bundled release
    - name: Package bundled release
      run: |
        mv res/run-faucet.* ./
        chmod +x ./run-faucet.sh
        tar cfz powfaucet-server-all.tar.gz bundle static faucet-config.example.yaml run-faucet.sh
        zip -r powfaucet-server-all.zip bundle static faucet-config.example.yaml run-faucet.bat
    
    # package static folder
    - name: Package static folder
      run: |
        tar cfz powfaucet-static.tar.gz static
        zip -r powfaucet-static.zip static

    # build binaries
    - run: npm run package:binaries
    - run: node scripts/verify-packaged-runtime.mjs bin/server-linux

    # collect metadata
    - name: Get project versions
      run: |
        server_version="$(jq -r '.version' package.json)"
        client_version="$(jq -r '.version' faucet-client/package.json)"
        echo "server_version=$server_version" >> "$GITHUB_OUTPUT"
        echo "client_version=$client_version" >> "$GITHUB_OUTPUT"
      id: version

    - uses: actions/upload-artifact@v7
      with:
        name: powfaucet-server-win.exe
        path: bin/server-win.exe
    - uses: actions/upload-artifact@v7
      with:
        name: powfaucet-release-payload
        path: |
          bin/server-linux
          bin/server-win.exe
          *.tar.gz
          *.zip
          *.tgz

  verify_windows_binary:
    name: Verify packaged Windows runtime
    needs: [build_binaries]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 26.12.1
    - run: npm ci
    - uses: actions/download-artifact@v8
      with:
        name: powfaucet-server-win.exe
        path: bin
    - run: node scripts/verify-packaged-runtime.mjs bin/server-win.exe

  publish_release:
    name: Publish qualified release artifacts
    needs: [build_binaries, verify_windows_binary]
    if: vars.ENABLE_FORK_PUBLISH == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/download-artifact@v8
      with:
        name: powfaucet-release-payload
    - uses: actions/setup-node@v6
      with:
        node-version: ${{ env.NODE_VERSION }}
        registry-url: "https://registry.npmjs.org"
    - name: Publish qualified npm packages
      run: |
        for package in *.tgz; do
          npm publish "$package" --access public || true
        done
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    # create draft release
    - name: Create latest release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp ./bin/server-linux ./powfaucet-server-linux
        cp ./bin/server-win.exe ./powfaucet-server-win.exe
        cat > release-notes.md <<'EOF'
          ### Major Changes
          ...

          ### Release Artifacts
          | Release File  | Description |
          | ------------- | ------------- |
          | powfaucet-server-all [.tar.gz](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-server-all.tar.gz) / [.zip](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-server-all.zip) | PoWFaucet server for execution with local nodejs (recommended) |
          | [powfaucet-server-win.exe](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-server-win.exe) | PoWFaucet all-in-one executable for windows (NodeJS 26.12.1, 64bit) |
          | [powfaucet-server-linux](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-server-linux) | PoWFaucet all-in-one executable for linux (NodeJS 26.12.1, 64bit) |
          | powfaucet-static [.tar.gz](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-static.tar.gz) / [.zip](https://github.com/pk910/PoWFaucet/releases/download/v${{ needs.build_binaries.outputs.server_version }}/powfaucet-static.zip) | PoWFaucet static folder (optional, see [Operator Wiki](https://github.com/pk910/PoWFaucet/wiki/Operator-Wiki)) |
        EOF
        gh release create "v${{ needs.build_binaries.outputs.server_version }}" \
          --draft \
          --title "v${{ needs.build_binaries.outputs.server_version }}" \
          --notes-file release-notes.md \
          ./powfaucet-server-linux \
          ./powfaucet-server-win.exe \
          ./powfaucet-server-all.tar.gz \
          ./powfaucet-server-all.zip \
          ./powfaucet-static.tar.gz \
          ./powfaucet-static.zip
